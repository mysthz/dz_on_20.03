databaseChangeLog:
  - changeSet:
      id: 1
      author: mysthz
      changes:
        - createTable:
            tableName: currency
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: base_currency
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price_change_range
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
